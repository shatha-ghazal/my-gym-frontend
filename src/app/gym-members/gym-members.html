
<div class="page-container">

  <h1>Gym Members</h1>

  <p>View and manage registered gym members.</p>

  <div class="members-card">

    <h2>Registered Members</h2>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Membership</th>
          <th>Status</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let member of members">
          <td>{{ member.id }}</td>
          <td>{{ member.name }}</td>
          <td>{{ member.email }}</td>
          <td>{{ member.membership }}</td>
          <td>{{ member.status }}</td>
        </tr>
      </tbody>
    </table>

  </div>

  <a routerLink="/home">Back to Dashboard</a>

</div>
